spring:
  application:
    name: transfer-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "configserver:${CONFIG_SERVICE_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.2
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:1000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
