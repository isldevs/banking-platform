name: microservices-platform-demo

x-service-endpoints: &service-endpoints
  CUSTOMER_SERVICE_URL: http://customer-service:8082
  ACCOUNT_SERVICE_URL: http://account-service:8083
  AUTH_SERVICE_URL: http://auth-service:8081
  TRANSFER_SERVICE_URL: http://transfer-service:8084
  NOTIFICATION_SERVICE_URL: http://notification-service:8085
  AUDIT_SERVICE_URL: http://audit-service:8086

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_PASSWORD_AUTH: ${DB_PASSWORD_AUTH:?Set DB_PASSWORD_AUTH}
      DB_PASSWORD_CUSTOMER: ${DB_PASSWORD_CUSTOMER:?Set DB_PASSWORD_CUSTOMER}
      DB_PASSWORD_ACCOUNT: ${DB_PASSWORD_ACCOUNT:?Set DB_PASSWORD_ACCOUNT}
      DB_PASSWORD_TRANSFER: ${DB_PASSWORD_TRANSFER:?Set DB_PASSWORD_TRANSFER}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION:?Set DB_PASSWORD_NOTIFICATION}
      DB_PASSWORD_AUDIT: ${DB_PASSWORD_AUDIT:?Set DB_PASSWORD_AUDIT}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data

  config-service:
    build:
      context: ../config-service
    environment:
      SERVER_PORT: 8888
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8888:8888"

  auth-service:
    build:
      context: ../auth-service
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVICE_URL: http://config-service:8888
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      SECURITY_JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      DEMO_ADMIN_USERNAME: /app/secrets/jwt-public.pem
      SECURITY_JWT_KEYSTORE_PATH: /app/secrets/jwt-signing.p12
      SECURITY_JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:?Set JWT_KEYSTORE_PASSWORD}
      SECURITY_JWT_KEYSTORE_ALIAS: jwt-signing
      SECURITY_INTERNALKEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD}
      OAUTH2_DEMO_CLIENT_SECRET: ${OAUTH2_DEMO_CLIENT_SECRET:?Set OAUTH2_DEMO_CLIENT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_AUTH:?Set DB_PASSWORD_AUTH}
      <<: *service-endpoints
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./secrets/jwt-signing.p12:/app/secrets/jwt-signing.p12:ro
      - ./secrets/jwt-public.pem:/app/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_started

  customer-service:
    build:
      context: ../customer-service
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVICE_URL: http://config-service:8888
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      SECURITY_JWT_PUBLIC_KEY_PATH: /app/secrets/jwt-public.pem
      SECURITY_INTERNALKEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer
      SPRING_DATASOURCE_USERNAME: customer_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_CUSTOMER:?Set DB_PASSWORD_CUSTOMER}
      <<: *service-endpoints
    volumes:
      - ./secrets/jwt-public.pem:/app/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_started

  account-service:
    build:
      context: ../account-service
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVICE_URL: http://config-service:8888
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      SECURITY_JWT_PUBLIC_KEY_PATH: /app/secrets/jwt-public.pem
      SECURITY_INTERNALKEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account
      SPRING_DATASOURCE_USERNAME: account_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_ACCOUNT:?Set DB_PASSWORD_ACCOUNT}
      DEMO_FUNDINGENABLED: 'true'
      <<: *service-endpoints
    volumes:
      - ./secrets/jwt-public.pem:/app/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_started

  transfer-service:
    build:
      context: ../transfer-service
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVICE_URL: http://config-service:8888
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      SECURITY_JWT_PUBLIC_KEY_PATH: /app/secrets/jwt-public.pem
      SECURITY_INTERNALKEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transfer
      SPRING_DATASOURCE_USERNAME: transfer_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_TRANSFER:?Set DB_PASSWORD_TRANSFER}
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      <<: *service-endpoints
    volumes:
      - ./secrets/jwt-public.pem:/app/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      config-service:
        condition: service_started

  notification-service:
    build:
      context: ../notification-service
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVICE_URL: http://config-service:8888
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      SECURITY_JWT_PUBLIC_KEY_PATH: /app/secrets/jwt-public.pem
      SECURITY_INTERNALKEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_NOTIFICATION:?Set DB_PASSWORD_NOTIFICATION}
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      <<: *service-endpoints
    volumes:
      - ./secrets/jwt-public.pem:/app/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      config-service:
        condition: service_started

  audit-service:
    build:
      context: ../audit-service
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVICE_URL: http://config-service:8888
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      SECURITY_JWT_PUBLIC_KEY_PATH: /app/secrets/jwt-public.pem
      SECURITY_INTERNALKEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit
      SPRING_DATASOURCE_USERNAME: audit_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_AUDIT:?Set DB_PASSWORD_AUDIT}
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      <<: *service-endpoints
    volumes:
      - ./secrets/jwt-public.pem:/app/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      config-service:
        condition: service_started

  gateway-service:
    build:
      context: ../gateway-service
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVICE_URL: http://config-service:8888
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      SECURITY_JWT_PUBLIC_KEY_PATH: /app/secrets/jwt-public.pem
      <<: *service-endpoints
    volumes:
      - ./secrets/jwt-public.pem:/app/secrets/jwt-public.pem:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      config-service:
        condition: service_started

volumes:
  postgres_data:
  kafka_data:
