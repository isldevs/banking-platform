server:
  port: 8081
  error:
    include-message: never

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    # Local Gradle runs from auth-service; Docker overrides this with /app/secrets/jwt-signing.p12.
    keystore-path: ${SECURITY_JWT_KEYSTORE_PATH:${user.dir}/../infrastructure/secrets/jwt-signing.p12}
    keystore-password: ${SECURITY_JWT_KEYSTORE_PASSWORD}
    keystore-alias: ${SECURITY_JWT_KEYSTORE_ALIAS:jwt-signing}
    issuer: ${SECURITY_JWT_ISSUER}
    audience: ${SECURITY_JWT_AUDIENCE}

demo:
  admin-username: ${DEMO_ADMIN_USERNAME:admin}
  admin-password: ${DEMO_ADMIN_PASSWORD}
  user-username: ${DEMO_USER_USERNAME:user}
  user-password: ${DEMO_USER_PASSWORD}
