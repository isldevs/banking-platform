server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/auth}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
  flyway:
    enabled: true

security:
  jwt:
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH}
    issuer: ${SECURITY_JWT_ISSUER}
    audience: ${SECURITY_JWT_AUDIENCE}

demo:
  admin-username: ${DEMO_ADMINUSERNAME:admin}
