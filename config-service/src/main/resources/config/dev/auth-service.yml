server:
  port: 8081
  error:
    include-message: never

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_AUTH_URL}
    username: ${DB_AUTH_USERNAME}
    password: ${DB_AUTH_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:${user.dir}/infrastructure/secrets/jwt-public.pem}
    # Direct Gradle runs are launched from the repository root; the environment can override this path.
    keystore-path: ${SECURITY_JWT_KEYSTORE_PATH:${user.dir}/infrastructure/secrets/jwt-signing.p12}
    keystore-password: ${SECURITY_JWT_KEYSTORE_PASSWORD}
    keystore-alias: ${SECURITY_JWT_KEYSTORE_ALIAS:jwt-signing}
    issuer: ${SECURITY_JWT_ISSUER}
    audience: ${SECURITY_JWT_AUDIENCE}
    access-token-ttl: ${SECURITY_JWT_ACCESS_TOKEN_TTL:PT15M}

demo:
  admin-username: ${DEMO_ADMIN_USERNAME:admin}
  admin-password: ${DEMO_ADMIN_PASSWORD}
  user-username: ${DEMO_USER_USERNAME:user}
  user-password: ${DEMO_USER_PASSWORD}
