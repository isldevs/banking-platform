spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    enabled: true

security:
  jwt:
    # Local Gradle runs normally use auth-service as the working directory.
    # Docker supplies SECURITY_JWT_KEYSTORE_PATH explicitly.
    keystore-path: ${SECURITY_JWT_KEYSTORE_PATH:${user.dir}/../.jwt/jwt-signing.p12}
    keystore-password: ${SECURITY_JWT_KEYSTORE_PASSWORD}
    keystore-alias: ${SECURITY_JWT_KEYSTORE_ALIAS:jwt-signing}
    issuer: ${SECURITY_JWT_ISSUER}
    audience: ${SECURITY_JWT_AUDIENCE}

demo:
  admin-username: ${DEMO_ADMIN_USERNAME:admin}
