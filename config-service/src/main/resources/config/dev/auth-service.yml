spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5555/auth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  flyway:
    enabled: true

security:
  jwt:
    keystore-path: ${SECURITY_JWT_KEYSTORE_PATH}
    keystore-password: ${SECURITY_JWT_KEYSTORE_PASSWORD}
    keystore-alias: ${SECURITY_JWT_KEYSTORE_ALIAS}
    issuer: ${SECURITY_JWT_ISSUER}
    audience: ${SECURITY_JWT_AUDIENCE}

demo:
  admin-username: ${DEMO_ADMIN_USERNAME:admin}
