server:
  port: 8083
  error:
    include-message: never

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_ACCOUNT_URL}
    username: ${DB_ACCOUNT_USERNAME}
    password: ${DB_ACCOUNT_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:${user.dir}/infrastructure/secrets/jwt-public.pem}
  legacy:
    internal-key: ${INTERNAL_SERVICE_KEY}

services:
  customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}

demo:
  funding-enabled: ${FUNDING_ENABLED:false}
