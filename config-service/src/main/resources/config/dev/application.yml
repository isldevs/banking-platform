spring:
  cloud:
    config:
      allowOverride: true
      overrideSystemProperties: false
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
