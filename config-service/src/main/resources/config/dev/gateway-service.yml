server:
  port: 8080
  error:
    include-message: never

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    issuer: ${SECURITY_JWT_ISSUER:http://localhost:8081}
    audience: ${SECURITY_JWT_AUDIENCE:api}

gateway:
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}
    default-limit: ${GATEWAY_RATE_LIMIT_DEFAULT_LIMIT:60}
    default-window: ${GATEWAY_RATE_LIMIT_DEFAULT_WINDOW:1m}
    rules:
      - name: auth-login
        method: POST
        path-prefix: /api/auth/login
        limit: 5
        window: 1m
      - name: auth-refresh
        method: POST
        path-prefix: /api/auth/refresh
        limit: 10
        window: 1m
      - name: account-opening
        method: POST
        path-prefix: /api/accounts
        limit: 10
        window: 1m
      - name: transfers
        method: POST
        path-prefix: /api/transfers
        limit: 10
        window: 1m
  http-client:
    connect-timeout: ${GATEWAY_HTTP_CONNECT_TIMEOUT:2s}
    connection-request-timeout: ${GATEWAY_HTTP_CONNECTION_REQUEST_TIMEOUT:1s}
    read-timeout: ${GATEWAY_HTTP_READ_TIMEOUT:8s}
    max-connections: ${GATEWAY_HTTP_MAX_CONNECTIONS:200}
    max-connections-per-route: ${GATEWAY_HTTP_MAX_CONNECTIONS_PER_ROUTE:50}
    idle-connection-eviction: ${GATEWAY_HTTP_IDLE_CONNECTION_EVICTION:30s}

services:
  customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
  account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  transfer-url: ${TRANSFER_SERVICE_URL:http://localhost:8084}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
  audit-url: ${AUDIT_SERVICE_URL:http://localhost:8086}
