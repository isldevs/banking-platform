server:
  port: 8081
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
  flyway:
    enabled: true
security:
  jwt:
    public-key-path: ${DEMO_ADMIN_USERNAME}
    issuer: ${SECURITY_JWT_ISSUER}
    audience: ${SECURITY_JWT_AUDIENCE}
demo:
  admin-username: ${DEMO_ADMIN_USERNAME:admin}
