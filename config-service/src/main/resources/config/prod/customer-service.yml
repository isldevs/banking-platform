server:
  port: 8082
  error:
    include-message: never

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME:customer_user}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH}