server:
  port: 8083
  error:
    include-message: never

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME:account_user}
  flyway:
    enabled: true
    baseline-on-migrate: true

demo:
  funding-enabled: ${FUNDING_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH}
