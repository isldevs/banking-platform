spring:
  application:
    name: config-service
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config/{profile}

server:
  port: ${SERVER_PORT:8888}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
