plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.demo'
version = project.findProperty('appVersion') ?: '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2023.0.3')
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-config-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

springBoot {
    buildInfo()
}

def generatedVersionDir = layout.buildDirectory.dir('generated-resources/version')
sourcesets {
}

sourceSets {
    main {
        resources {
            srcDir(generatedVersionDir)
        }
    }
}

tasks.named('processResources') {
    inputs.property('applicationVersion', project.version)

    doFirst {
        def outputDir = generatedVersionDir.get().asFile
        outputDir.mkdirs()
        file("${outputDir}/application-version.properties").text = "application.version=${project.version}\n"
    }
}

tasks.named('bootJar') {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}
