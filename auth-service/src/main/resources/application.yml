spring:
  application:
    name: auth-service
  config:
    import: "configserver:${CONFIG_SERVICE_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
      label: ${CONFIG_REPO_LABEL:main}
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.2

security:
  jwt:
    keystore-path: ${SECURITY_JWT_KEYSTOREPATH}
    keystore-password: ${SECURITY_JWT_KEYSTOREPASSWORD}
    keystore-alias: ${SECURITY_JWT_KEYSTOREALIAS:jwt-signing}
