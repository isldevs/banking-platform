spring:
  application:
    name: account-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "configserver:${CONFIG_SERVICE_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.2

security:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
