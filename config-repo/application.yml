spring:
  cloud:
    config:
      # Allow deployment environment variables/system properties to override safe defaults.
      allowOverride: true
      overrideSystemProperties: false

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
