spring:
  cloud:
    config:
      allowOverride: true
      overrideSystemProperties: false

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    issuer: http://localhost:8081
    audience: api

services:
  customer-url: http://localhost:8082
  account-url: http://localhost:8083
  auth-url: http://localhost:8081
  transfer-url: http://localhost:8084
  notification-url: http://localhost:8085
  audit-url: http://localhost:8086
